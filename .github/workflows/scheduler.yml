name: Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/v1/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/v1/tick" \
               -H "X-Cron-Secret: $CRON_SECRET" \
               --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors
